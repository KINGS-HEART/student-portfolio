<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Me | Kingsley</title>
</head>

<body>

    <header>

        <h1>Contact Me</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
            <a href="media.html">Media</a>
            <a href="sitemap.html">Site Map</a>
        </nav>
        

    </header>

    <main>
        <section>

            <h2>Send Me a Message</h2>
            <label for="email">Email Address:</label>

<input
    type="email"
    id="email"
    name="email"      
    
    
>
<br>
<br>
<label for="phone">Phone Number:</label>

<input
    type="tel"
    id="phone"
    name="phone"
>
<br>
<br>
<fieldset>

    <legend>What is your reason for contacting me?</legend>

    <input
        type="radio"
        id="job"
        name="reason"
        value="job"
    >

    <label for="job">Job Opportunity</label>

    <input
        type="radio"
        id="project"
        name="reason"
        value="project"
    >

    <label for="project">Project</label>

    <input
        type="radio"
        id="general"
        name="reason"
        value="general"
    >

    <label for="general">General Enquiry</label>

</fieldset>

<br>


<fieldset>

    <legend>What services interest you?</legend>

    <input
        type="checkbox"
        id="web-development"
        name="services"
        value="web-development"
    >

    <label for="web-development">
        Web Development
    </label>

    <input
        type="checkbox"
        id="frontend"
        name="services"
        value="frontend"
    >

    <label for="frontend">
        Frontend Development
    </label>

    <input
        type="checkbox"
        id="consultation"
        name="services"
        value="consultation"
    >

    <label for="consultation">
        Consultation
    </label>

</fieldset>
<br>
<br>

<label for="message">Your Message:</label>

<textarea
    id="message"
    name="message"
    rows="6"
    cols="40"
></textarea>
            <form>
        
            </form>
        
        </section>

    </main>

    </footer>

</body>

</html>
